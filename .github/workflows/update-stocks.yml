name: 테마주 이론 검증 데이터 자동수집

on:
  schedule:
    - cron: '30 21 * * *'   # 매일 06:30 KST (UTC 21:30 전날)
  workflow_dispatch:          # 수동 실행 버튼

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # 외부 의존성 없음 — Node 내장 fetch 만 사용하므로 npm install 생략

      - name: 수식 자체검증 (합성 데이터 58종)
        run: node scripts/test-stocks-math.js

      - name: 파이프라인 엔드투엔드 검증 (가짜 API 응답 42종)
        run: node scripts/test-stocks-e2e.js

      - name: 주가·매크로 수집 및 이론 검증
        run: node scripts/fetch-stocks.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stocks.json
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "chore: 테마주 이론 검증 데이터 자동수집 $(date +'%Y-%m-%d')"
          git pull --rebase origin "${{ github.ref_name }}"
          git push -u origin "HEAD:${{ github.ref_name }}"
