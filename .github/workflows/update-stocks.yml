name: 테마주 이론 검증 데이터 자동수집

on:
  schedule:
    - cron: '30 21 * * *'   # 매일 06:30 KST (UTC 21:30 전날)
  workflow_dispatch:          # 수동 실행 버튼
  # [임시] 병합 전에 실제 API로 도는지 확인하기 위한 트리거. 확인 후 제거할 것.
  # data/** 는 제외 — 이 워크플로가 커밋하는 경로라 재실행 고리를 만들지 않기 위함
  # (GITHUB_TOKEN 으로 푸시한 커밋은 원래 워크플로를 다시 트리거하지 않지만 안전장치로 둔다)
  push:
    branches: ['claude/stock-investment-discussion-nkvemz']
    paths-ignore: ['data/**']

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # 외부 의존성 없음 — Node 내장 fetch 만 사용하므로 npm install 생략

      - name: 수식 자체검증 (합성 데이터 58종)
        run: node scripts/test-stocks-math.js

      - name: 파이프라인 엔드투엔드 검증 (가짜 API 응답 42종)
        run: node scripts/test-stocks-e2e.js

      - name: 주가·매크로 수집 및 이론 검증
        run: node scripts/fetch-stocks.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stocks.json
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "chore: 테마주 이론 검증 데이터 자동수집 $(date +'%Y-%m-%d')"
          git pull --rebase origin "${{ github.ref_name }}"
          git push -u origin "HEAD:${{ github.ref_name }}"
